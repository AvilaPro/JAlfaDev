<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

                <li>10</li>

            h3
            <div>
                <p>una p en h3</p>
                <h1>h1 en h3</h1>
            </div>
        </h3>
        <h1 id="subtitulo">h1

                <li>4</li>

        <h2 class="capitulo">h2</h2>
    </div>

</html>
