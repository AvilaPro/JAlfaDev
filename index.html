<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/claseJS3.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <section id="clase1" style="display: none ;">
        <div>
            <input type="text" placeholder="Ingresa la informacion" id="info">
            <button onclick="registrarEnTabla()" class="btn btn-success">Registrar</button>
            <hr><hr>
            <ol id="contenedor">
    
            </ol>
        </div>
        <hr><hr>
        <table class="table table-dark table-striped-columns" id="tabla">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Desafio 1</th>
                    <th>Desafio 2</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
        </table>
    </section>
    <section id="clase2" class="container mt-5">
        <div class="row">
            <form onsubmit="return manejarEnvio(event)" action="" name="loginForm" method="get" class="border border-4 border-success rounded-3 p-4">
                <div>
                    <label for="username" class="form-label">username</label>
                    <input type="text" id="username" placeholder="username..." name="username" class="form-control">
                    <div id="usernameError" class="form-text text-danger">El campo username no puede estar vacio</div>
                </div>
                <div>
                    <label for="password" class="form-label">password</label>
                    <input type="password" id="password" placeholder="password..." name="password" class="form-control">
                    <div id="pwdError" class="form-text text-danger">El campo de password no debe quedar vacio</div>
                </div>
                <!-- Formas de enviar el formulario -->
                <!-- <input type="submit" value="Iniciar Sesion"> -->
                <button class="btn btn-success my-3">Iniciar Sesion</button>
                 <!-- <input type="button" value="Iniciar Sesion" onclick="enviarFormulario()"> -->
            </form>
        </div>
    </section>
    <script src="./js/main.js"></script>
    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
