<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href=".">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<body onload="getAllCharacters()" onscroll="scrollInfinito()">
 
  <header>
    <img src="" alt="">
    <button id="login" onclick="loginPolicia()">Iniciar</button>
  </header>
  <main>
    <h1>Bienvenido <span>@</span></h1>
    <form action="" name="registroMulta" method="get">
      <div>
        <label for="placa">Placa:</label>
        <input type="text" name="placa" id="placa">
      </div>
      <div>
        <label for="ubicacion">Ubicacion:</label>
        <input onfocus="otraPrueba()" type="text" name="ubicacion" id="ubicacion">
      </div>
      <div>
        <label for="multa">Multa:</label>
        <select name="multa" id="multa" onchange="calcularMulta(event)">
          <option value="0">Seleccione</option>
          <option value="1">Mal parado</option>
          <option value="2">Insolvente</option>
          <option value="3">Cinturon</option>
        </select>
      </div>
      <button type="submit">Registrar</button>
    </form>
    <hr>
    <hr>
    <div class="d-flex justify-content-around">
      <button class="btn btn-primary" onclick="irPaginaIntt()">INTT</button>
      <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
      <button class="btn btn-primary"onclick="conocerIdioma()">Navegar por idioma</button>
      <button class="btn btn-primary" onclick="console.log(history.forward());">Ir Adelante</button>
      <button class="btn btn-success" onclick="mostrarPersonajes(personajes)">Agregar personajes</button>
      <button onclick="window.open('./webES.html', '', `width=${screen.width/2}, height=${screen.availHeight / 2}`)">Open</button>
      <!-- <button onclick="obtenerMasPersonajes(auxSiguienteListaDePersonajes)">Mas Personajes</button> -->
    </div>
    <section class="container" style="height: 1500px;">
      <div id="personajes" class="row">

      </div>
    </section>
  </main>


  <!-- Boton flotante -->
   <div class="btn btn-outline-primary rounded-circle" style="position: fixed; bottom: 50px; right: 50px;"><ion-icon name="arrow-up-outline" onclick="window.scrollTo({top:0, left:0, behavior: 'smooth'})"></ion-icon></div>

  <!-- Nuestos scripts -->
   <script src="./js/clase1.js"></script>
   <!-- Script de Bootstrap -->
