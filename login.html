    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- <script src="./js/jquery.js"></script> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Artificialy</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./register.html">Register</a>
                  </li>
                  <li class="nav-item">

                  </li>

                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                  </li> -->
                </ul>

            </div>
          </nav>
    </header>

    <main>
      <h1 id="welcome">Welcome <span id="userSpan"></span> <button class="btn btn-warning">animacion</button></h1>
        <div id="loginForm" class="border border-success border-5 rounded-4 p-5 m-5">
          <div class="form-floating mb-3">
              <input type="text" class="form-control" id="usernameInput" placeholder="Write your Username...">
              <span style="color: red; display: none;">No puede quedar vacio</span>
              <label for="usernameInput">Username</label>
          </div>
          <div class="form-floating mb-3">
              <input type="password" class="form-control" id="passwordInput" placeholder="Write your password...">
              <span style="color: red; display: none;">No puede quedar vacio</span>
              <label for="passwordInput">Password</label>
          </div>
          <button class="btn btn-success">Login</button>
        </div>
    </main>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
